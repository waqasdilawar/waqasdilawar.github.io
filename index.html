  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --accent: #0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #8ab4f8; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px;
    }
    main { max-width: 560px; }
    h1 { font-size: 2.25rem; line-height: 1.2; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a { text-underline-offset: 4px; }
    a:hover, a:focus-visible { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    footer { margin-top: 3rem; font-size: .85rem; color: var(--muted); }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: rise .5s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, I'm Waqas.</h1>

    </ul>
    <footer>© 2026 Muhammad Waqas Dilawar</footer>
  </main>
</body>
